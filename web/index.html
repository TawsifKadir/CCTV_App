<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Enrolly — Employee Enrollment &amp; Identity Management.">
  <meta name="theme-color" content="#F4F1E9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Enrolly">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Enrolly</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F4F1E9; }
    #enrolly-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #222; transition: opacity .35s ease;
    }
    #enrolly-splash .mark {
      width: 64px; height: 64px; border-radius: 20px; background: #FF9966 url("icons/Icon-192.png") center / cover;
      box-shadow: 0 10px 24px rgba(255,153,102,.35);
      animation: enrolly-pulse 1.4s ease-in-out infinite;
    }
    #enrolly-splash .name { font-size: 22px; font-weight: 600; letter-spacing: -.2px; }
    #enrolly-splash .hint { font-size: 13px; color: #85837E; }
    @keyframes enrolly-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(.92); } }
    @media (prefers-reduced-motion: reduce) { #enrolly-splash .mark { animation: none; } }
    @media (prefers-color-scheme: dark) {
      html, body { background: #171614; }
      #enrolly-splash { color: #F4F1E9; }
      #enrolly-splash .hint { color: #A8A49B; }
    }
  </style>
</head>
<body>
  <div id="enrolly-splash" aria-label="Loading Enrolly">
    <div class="mark"></div>
    <div class="name">Enrolly</div>
    <div class="hint">Preparing your workspace…</div>
  </div>
  <script>
    // Remove the HTML splash once Flutter renders its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('enrolly-splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 400); }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
